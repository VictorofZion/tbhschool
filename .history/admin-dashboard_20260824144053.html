<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Tetotim Blessed Hope School</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    :root {
      --primary-navy: #0a1931;
      --accent-coral: #e25b38;
      --bg-cream: #f9f6f0;
      --border-color: #e4dfd5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Geist-Regular', sans-serif;
      background-color: var(--bg-cream);
      color: #1c1c1c;
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background-color: var(--primary-navy);
      color: #ffffff;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .brand img { width: 36px; height: auto; }
    .brand h2 {
      font-family: 'Geist-Bold', sans-serif;
      font-size: 16px;
      margin: 0;
    }
    .nav-links { display: flex; flex-direction: column; gap: 8px; }
    .nav-btn {
      background: transparent;
      border: none;
      color: #e4dfd5;
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      background-color: var(--accent-coral);
      color: #ffffff;
    }
    .logout-btn {
      background-color: rgba(255,255,255,0.1);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .header-bar h1 {
      font-family: 'Instrument Serif-Regular', serif;
      font-size: 36px;
      color: var(--primary-navy);
      margin: 0;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .student-field { display: flex; }
    label { font-size: 13px; font-weight: 600; }
    input, select {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
    }
    .btn-submit {
      background-color: var(--accent-coral);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 12px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }
    th { background-color: #f1ede4; color: var(--primary-navy); }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }
    .btn-delete {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand">
        <img src="items/logo.png" alt="Logo" />
        <h2>TBHS Admin</h2>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" onclick="switchTab('usersTab', event)">All Users</button>
        <button class="nav-btn" onclick="switchTab('createUserTab', event)">Create User Account</button>
      </nav>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </aside>

  <main class="main-content">
    <div class="header-bar">
      <h1 id="tabTitle">User Management</h1>
      <span id="adminName">Welcome, Admin</span>
    </div>

    <!-- Tab 1: All Users -->
    <section id="usersTab" class="tab-content active">
      <div class="card">
        <div style="display: flex; gap: 12px; margin-bottom: 16px;">
          <select id="roleFilter" onchange="fetchUsers()">
            <option value="">All Roles</option>
            <option value="student">Students</option>
            <option value="teacher">Teachers</option>
            <option value="admin">Admins</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Avatar</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Created Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Dynamic Content -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Tab 2: Create User -->
    <section id="createUserTab" class="tab-content">
      <div class="card">
        <form id="createUserForm" onsubmit="handleCreateUser(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="fullName" required />
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="userEmail" required />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="userPassword" required />
            </div>
            <div class="form-group">
              <label>Profile Image URL (Display Picture)</label>
              <input type="url" id="avatarUrl" placeholder="https://example.com/photo.jpg" />
            </div>
            <div class="form-group">
              <label>Role</label>
              <select id="userRole" onchange="toggleStudentFields()" required>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="form-group student-field">
              <label>Registration Number</label>
              <input type="text" id="regNumber" placeholder="TBHS/2026/001" />
            </div>
            <div class="form-group student-field">
              <label>Unique Serial Number</label>
              <input type="text" id="serialNumber" placeholder="SN-TBHS-982134 (Auto-generated if blank)" />
            </div>
            <div class="form-group student-field">
              <label>Class Level</label>
              <input type="text" id="classLevel" placeholder="JS1 or SS2" />
            </div>
          </div>
          <button type="submit" class="btn-submit">Create Account</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "http://localhost:5000/api";
    const token = localStorage.getItem("tbhs_token");
    const user = JSON.parse(localStorage.getItem("tbhs_user") || "{}");

    if (!token || user.role !== "admin") {
      window.location.href = "login.html";
    }

    document.getElementById("adminName").innerText = `Welcome, ${user.full_name || 'Admin'}`;

    function switchTab(tabId, evt) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      if (evt && evt.target) evt.target.classList.add("active");
      
      if (tabId === 'usersTab') fetchUsers();
    }

    function toggleStudentFields() {
      const role = document.getElementById("userRole").value;
      const studentFields = document.querySelectorAll(".student-field");
      studentFields.forEach(field => {
        field.style.display = role === "student" ? "flex" : "none";
      });
    }

    async function fetchUsers() {
      const roleFilter = document.getElementById("roleFilter").value;
      const url = `${API_BASE}/admin/users${roleFilter ? '?role=' + roleFilter : ''}`;

      try {
        const res = await fetch(url, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        
        const tbody = document.getElementById("usersTableBody");
        tbody.innerHTML = "";

        if (data.users && data.users.length > 0) {
          data.users.forEach(u => {
            const avatar = u.avatar_url || 'https://via.placeholder.com/150';
            tbody.innerHTML += `
              <tr>
                <td><img src="${avatar}" class="user-avatar" alt="Avatar" /></td>
                <td>${u.full_name}</td>
                <td>${u.email}</td>
                <td><strong>${u.role.toUpperCase()}</strong></td>
                <td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td>
                  ${u.role !== 'admin' ? `<button class="btn-delete" onclick="deleteUser('${u.id}')">Delete</button>` : ''}
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No users found.</td></tr>`;
        }
      } catch (err) {
        alert("Error loading users.");
      }
    }

    async function handleCreateUser(e) {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById("fullName").value,
        email: document.getElementById("userEmail").value,
        password: document.getElementById("userPassword").value,
        avatar_url: document.getElementById("avatarUrl").value,
        role: document.getElementById("userRole").value,
        reg_number: document.getElementById("regNumber").value,
        serial_number: document.getElementById("serialNumber").value,
        class_level: document.getElementById("classLevel").value
      };

      try {
        const res = await fetch(`${API_BASE}/auth/create-user`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        alert("User account created successfully!");
        document.getElementById("createUserForm").reset();
        switchTab("usersTab");
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteUser(userId) {
      if (!confirm("Are you sure you want to delete this user?")) return;

      try {
        const res = await fetch(`${API_BASE}/admin/users/${userId}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) throw new Error("Delete failed");
        alert("User deleted.");
        fetchUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    fetchUsers();
  </script>
</body>
</html>
