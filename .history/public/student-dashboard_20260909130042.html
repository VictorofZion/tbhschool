<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Portal - Tetotim Blessed Hope School</title>
  <!-- Browser Tab Favicon -->
<link rel="icon" type="image/png" href="items/logo.png" />
<!-- Apple iOS Shortcut Icon -->
<link rel="apple-touch-icon" href="items/logo.png" />
  <link rel="stylesheet" href="global.css" />
  <!-- Paystack Inline JS SDK -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  
  <style>
    :root {
      --primary-navy: #0a1931;
      --accent-coral: #e25b38;
      --bg-cream: #f9f6f0;
      --border-color: #e4dfd5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Geist-Regular', sans-serif; background-color: var(--bg-cream); color: #1c1c1c; display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background-color: var(--primary-navy); color: #ffffff; padding: 32px 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
    .brand img { width: 36px; height: auto; }
    .brand h2 { font-family: 'Geist-Bold', sans-serif; font-size: 16px; margin: 0; }
    .nav-links { display: flex; flex-direction: column; gap: 8px; }
    .nav-btn { background: transparent; border: none; color: #e4dfd5; padding: 12px 16px; text-align: left; font-size: 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .nav-btn.active, .nav-btn:hover { background-color: var(--accent-coral); color: #ffffff; }
    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .header-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    .student-avatar { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-coral); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .status-card { background: #ffffff; padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .badge { padding: 6px 12px; border-radius: 100px; font-weight: 700; font-size: 12px; }
    .badge-paid { background: #d4edda; color: #155724; }
    .badge-unpaid { background: #f8d7da; color: #721c24; }
    .pay-btn { background-color: #09a5db; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .pay-btn:hover { background-color: #0782ad; }
    .card { background: #ffffff; padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #ffffff; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background-color: #0a1931; color: #ffffff; }
    .btn-action { background-color: var(--accent-coral); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; display: inline-block; cursor: pointer; border: none; }
    .logout-btn { background-color: rgba(255,255,255,0.1); color: #ffffff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; }
    .progress-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 25, 49, 0.85); z-index: 2000; justify-content: center; align-items: center; }
    .progress-modal-card { background: #ffffff; padding: 32px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
    .progress-track { width: 100%; height: 12px; background: #e4dfd5; border-radius: 6px; overflow: hidden; margin: 16px 0 8px 0; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent-coral); transition: width 0.2s ease; }
    .progress-percent-text { font-family: 'Geist-Bold', sans-serif; font-size: 14px; color: var(--primary-navy); }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div style="display: flex; align-items: center; gap: 12px;">
          <img src="items/logo.png" alt="Logo" />
          <h2>TBHS Portal</h2>
        </div>
        <button class="mobile-nav-toggle" onclick="toggleMobileMenu()">☰</button>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" onclick="switchTab('overviewTab', event)">Overview &amp; Results</button>
        <button class="nav-btn" onclick="switchTab('examsTab', event)">Online CBT Exams</button>
        <button class="nav-btn" onclick="switchTab('assignmentsTab', event)">Class Assignments</button>
      </nav>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </aside>

  <main class="main-content">
    <div class="header-bar">
      <img id="studentAvatar" src="https://via.placeholder.com/150" class="student-avatar" alt="Avatar" />
      <div>
        <h1 id="welcomeHeading" style="font-family: 'Instrument Serif-Regular', serif; font-size: 36px; color: var(--primary-navy); margin: 0;">Student Portal</h1>
        <p id="serialNumberBadge" style="margin: 4px 0 0 0; color: var(--accent-coral); font-weight: 700; font-size: 14px;"></p>
      </div>
    </div>

    <!-- TAB 1: Overview & Results -->
    <section id="overviewTab" class="tab-content active">
      <div class="status-card">
        <div>
          <h3 style="margin: 0 0 4px 0;">School Fee Status</h3>
          <p id="studentInfo" style="margin: 0; color: #6e7787; font-size: 14px;"></p>
        </div>
        <div id="paymentAction"></div>
      </div>

      <h2 style="font-family: 'Instrument Serif-Regular', serif; font-size: 28px; color: var(--primary-navy);">Academic Results</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>Test (40)</th>
              <th>Exam (60)</th>
              <th>Total Score</th>
              <th>Term</th>
              <th>Session</th>
            </tr>
          </thead>
          <tbody id="resultsTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 2: Online CBT Exams -->
    <section id="examsTab" class="tab-content">
      <h2 style="font-family: 'Instrument Serif-Regular', serif; font-size: 28px; color: var(--primary-navy); margin-top: 0;">Available CBT Examinations</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Exam Title</th>
              <th>Subject</th>
              <th>Class</th>
              <th>Duration</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="examsTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 3: Class Assignments & Notes -->
    <section id="assignmentsTab" class="tab-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-family: 'Instrument Serif-Regular', serif; font-size: 28px; color: var(--primary-navy); margin: 0;">Class Learning Resources</h2>
        <select id="materialTypeFilter" onchange="loadAssignments()" style="padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-color);">
          <option value="">All Materials</option>
          <option value="note">Class Notes</option>
          <option value="assignment">Assignments</option>
        </select>
      </div>
      <div id="assignmentsWrapper"></div>
    </section>
  </main>

  <!-- Progress Loader Modal -->
  <div class="progress-modal-overlay" id="progressModal">
    <div class="progress-modal-card">
      <h3 id="progressTitle" style="font-family: 'Instrument Serif-Regular', serif; font-size: 24px; color: #0a1931; margin: 0;">Processing...</h3>
      <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
      <div class="progress-percent-text" id="progressPercent">0%</div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";
    const token = localStorage.getItem("tbhs_token");
    const user = JSON.parse(localStorage.getItem("tbhs_user") || "{}");
    const studentProfile = {
      id: user.student_id || user.id,
      class_level: user.class_level || 'JSS 1',
      reg_number: user.reg_number || 'N/A',
      serial_number: user.serial_number || 'N/A',
      fee_status: user.fee_status || 'UNPAID'
    };

    if (!token || user.role !== "student") {
      window.location.href = "login.html";
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('welcomeHeading').innerText = `Welcome, ${user.full_name || 'Student'}`;
      document.getElementById('serialNumberBadge').innerText = `Reg: ${studentProfile.reg_number} | Class: ${studentProfile.class_level}`;
      if (user.avatar_url) document.getElementById('studentAvatar').src = user.avatar_url;

      const isPaid = studentProfile.fee_status === 'PAID';
      document.getElementById('studentInfo').innerHTML = `Status: <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">${studentProfile.fee_status}</span>`;
      document.getElementById('paymentAction').innerHTML = isPaid 
        ? `<span class="badge badge-paid">Fees Fully Settled</span>`
        : `<button onclick="paySchoolFeesWithPaystack()" class="pay-btn">Pay Fees via Paystack</button>`;

      loadResults();
    });

    function toggleMobileMenu() {
      document.getElementById("sidebar").classList.toggle("mobile-open");
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      if (evt && evt.target) evt.target.classList.add("active");
      document.getElementById("sidebar").classList.remove("mobile-open");

      if (tabId === 'examsTab') loadExams();
      if (tabId === 'assignmentsTab') loadAssignments();
    }

    async function loadResults() {
      if (!studentProfile.id) return;
      try {
        const res = await fetch(`${API_BASE}/academic/results/${studentProfile.id}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        const tbody = document.getElementById("resultsTableBody");
        tbody.innerHTML = "";

        if (data.results && data.results.length > 0) {
          data.results.forEach(r => {
            const total = parseFloat(r.test_score) + parseFloat(r.exam_score);
            tbody.innerHTML += `
              <tr>
                <td><strong>${r.subject}</strong></td>
                <td>${r.test_score}</td>
                <td>${r.exam_score}</td>
                <td><strong>${total}</strong></td>
                <td>${r.term}</td>
                <td>${r.session}</td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #6e7787;">No academic results recorded yet.</td></tr>`;
        }
      } catch (err) { console.error("Failed to load results", err); }
    }

    async function loadExams() {
  if (!studentProfile.class_level) return;
  try {
    const res = await fetch(`${API_BASE}/exams/class/${studentProfile.class_level}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    const tbody = document.getElementById("examsTableBody");
    tbody.innerHTML = "";

    if (data.exams && data.exams.length > 0) {
      data.exams.forEach(e => {
        const typeBadge = e.type === 'test' 
          ? `<span style="background: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">TEST (40M)</span>`
          : `<span style="background: #fbe9e7; color: #d84315; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">EXAM (60M)</span>`;

        // Check if student is locked out of terminal exam due to unpaid fee status
        const isExamLocked = e.type === 'exam' && studentProfile.fee_status !== 'PAID';

        let actionCell = "";
        if (e.is_completed) {
          actionCell = `<span style="background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 12px;">COMPLETED</span>`;
        } else if (isExamLocked) {
          actionCell = `<span style="background: #f8d7da; color: #721c24; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 12px;">FEES REQUIRED</span>`;
        } else {
          actionCell = `<a href="exam.html?examId=${e.id}&duration=${e.duration_minutes}" class="btn-action">Start Assessment</a>`;
        }

        tbody.innerHTML += `
          <tr>
            <td><strong>${e.title}</strong> ${typeBadge}</td>
            <td>${e.subject}</td>
            <td>${e.class_level}</td>
            <td>${e.duration_minutes} Mins</td>
            <td>${actionCell}</td>
          </tr>
        `;
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #6e7787;">No CBT tests or exams scheduled.</td></tr>`;
    }
  } catch (err) { console.error("Failed to load exams", err); }
}
    async function loadAssignments() {
      if (!studentProfile.class_level) return;
      const filterType = document.getElementById("materialTypeFilter") ? document.getElementById("materialTypeFilter").value : "";
      const url = `${API_BASE}/materials/class/${studentProfile.class_level}${filterType ? '?type=' + filterType : ''}`;

      try {
        const res = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
        const data = await res.json();
        const wrapper = document.getElementById("assignmentsWrapper");
        wrapper.innerHTML = "";

        if (data.materials && data.materials.length > 0) {
          data.materials.forEach(m => {
            const isNote = m.material_type === 'note';
            const typeBadge = isNote
              ? `<span style="background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">CLASS NOTE</span>`
              : `<span style="background: #fff3e0; color: #e65100; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">ASSIGNMENT</span>`;

            wrapper.innerHTML += `
              <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                  <h3 style="margin: 0; color: var(--primary-navy);">${m.title} ${typeBadge}</h3>
                </div>
                <p style="margin: 0 0 12px 0; font-size: 13px; color: #6e7787;"><strong>Subject:</strong> ${m.subject} | <strong>Class:</strong> ${m.class_level}</p>
                <p style="margin: 0 0 16px 0; font-size: 14px; line-height: 1.5;">${m.description || 'No additional notes provided.'}</p>
                <button onclick="downloadFileWithProgress('${m.file_data}', '${m.file_name}')" class="btn-action">Download ${m.file_name}</button>
              </div>
            `;
          });
        } else {
          wrapper.innerHTML = `<p style="text-align: center; color: #6e7787;">No learning materials found.</p>`;
        }
      } catch (err) { console.error("Failed to load materials", err); }
    }

    async function paySchoolFeesWithPaystack() {
  try {
    // Ensure candidate email exists and is valid
    const cleanEmail = (user.email || "").trim();
    if (!cleanEmail || !cleanEmail.includes("@")) {
      alert("A valid email address is required to process payment. Please update your email profile or re-login.");
      return;
    }

    // 1. Fetch exact class fee and transaction reference from server
    const res = await fetch(`${API_BASE}/payments/initiate`, {
      method: "POST",
      headers: { 
        "Content-Type": "application/json", 
        "Authorization": `Bearer ${token}` 
      },
      body: JSON.stringify({ 
        student_id: studentProfile.id,
        payer_email: cleanEmail 
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const payerEmail = (data.email || cleanEmail).trim();

    // Confirm amount with user before opening checkout pop-up
    const confirmPay = confirm(`School fee for ${data.classLevel} is ₦${data.nairaAmount.toLocaleString()}. Proceed to Paystack payment gateway?`);
    if (!confirmPay) return;

    // 2. Trigger Paystack Inline Popup with guaranteed valid email
    const handler = PaystackPop.setup({
      key: data.paystackKey,
      email: payerEmail,
      amount: data.amount, // In Kobo
      currency: "NGN",
      ref: data.reference,
      metadata: {
        custom_fields: [
          { display_name: "Student Name", variable_name: "student_name", value: user.full_name },
          { display_name: "Class Level", variable_name: "class_level", value: data.classLevel }
        ]
      },
      callback: function(response) {
        (async () => {
          try {
            const verifyRes = await fetch(`${API_BASE}/payments/verify`, {
              method: "POST",
              headers: { 
                "Content-Type": "application/json", 
                "Authorization": `Bearer ${token}` 
              },
              body: JSON.stringify({ 
                reference: response.reference, 
                studentId: studentProfile.id 
              })
            });

            const verifyData = await verifyRes.json();
            if (!verifyRes.ok) throw new Error(verifyData.error || "Payment verification failed.");

            alert("Payment Verified Successfully!");
            user.fee_status = 'PAID';
            localStorage.setItem("tbhs_user", JSON.stringify(user));
            location.reload();
          } catch (err) {
            alert(err.message);
          }
        })();
      },
      onClose: function() {
        alert("Payment window closed.");
      }
    });

    handler.openIframe();

  } catch (err) { 
    alert(err.message); 
  }
}

    function downloadFileWithProgress(fileDataUrl, fileName) {
      if (fileDataUrl.startsWith("http")) {
        window.open(fileDataUrl, "_blank");
      } else {
        const link = document.createElement("a");
        link.href = fileDataUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
