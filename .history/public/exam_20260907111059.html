<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CBT Assessment - Tetotim Blessed Hope School</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    body { margin: 0; font-family: 'Geist-Regular', sans-serif; background-color: #f9f6f0; color: #1c1c1c; padding: 20px; }
    .exam-container { max-width: 700px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #e4dfd5; }
    .exam-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e4dfd5; padding-bottom: 16px; margin-bottom: 20px; }
    .timer { font-family: 'Geist-Bold', sans-serif; font-size: 20px; color: #e25b38; background: #fbe9e7; padding: 8px 16px; border-radius: 6px; }
    .question-card { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #f0ece1; }
    .question-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
    .options-list { display: flex; flex-direction: column; gap: 8px; }
    .option-item { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
    .submit-btn { background: #e25b38; color: #fff; border: none; padding: 14px 28px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="exam-container">
  <div class="exam-header">
    <h2 style="margin:0; font-family: 'Instrument Serif-Regular', serif; color: #0a1931;">CBT Assessment</h2>
    <div class="timer" id="timerDisplay">--:--</div>
  </div>

  <form id="examForm" onsubmit="handleExamSubmit(event)">
    <div id="questionsContainer">Loading examination questions...</div>
    <button type="submit" class="submit-btn" id="submitBtn">Submit Assessment</button>
  </form>
</div>

<script>
  const API_BASE = "/api";
  const token = localStorage.getItem("tbhs_token");
  const user = JSON.parse(localStorage.getItem("tbhs_user") || "{}");
  const urlParams = new URLSearchParams(window.location.search);
  const examId = urlParams.get("examId");
  const durationMinutes = parseInt(urlParams.get("duration") || "20", 10);

  let timerInterval;

  if (!token || !examId) window.location.href = "student-dashboard.html";

  async function loadQuestions() {
    try {
      const res = await fetch(`${API_BASE}/exams/${examId}/questions`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      if (data.questions && data.questions.length > 0) {
        data.questions.forEach((q, idx) => {
          container.innerHTML += `
            <div class="question-card">
              <div class="question-title">Q${idx + 1}. ${q.question_text}</div>
              <div class="options-list">
                <label class="option-item"><input type="radio" name="q_${q.id}" value="A" required /> A) ${q.option_a}</label>
                <label class="option-item"><input type="radio" name="q_${q.id}" value="B" /> B) ${q.option_b}</label>
                <label class="option-item"><input type="radio" name="q_${q.id}" value="C" /> C) ${q.option_c}</label>
                <label class="option-item"><input type="radio" name="q_${q.id}" value="D" /> D) ${q.option_d}</label>
              </div>
            </div>
          `;
        });
        startTimer(durationMinutes * 60);
      } else {
        container.innerHTML = "<p>No questions found for this exam.</p>";
      }
    } catch (err) { alert(err.message); }
  }

  function startTimer(secondsLeft) {
    const timerDisplay = document.getElementById("timerDisplay");
    timerInterval = setInterval(() => {
      const mins = Math.floor(secondsLeft / 60);
      const secs = secondsLeft % 60;
      timerDisplay.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert("Time expired! Submitting your answers automatically.");
        document.getElementById("examForm").requestSubmit();
      }
      secondsLeft--;
    }, 1000);
  }

  async function handleExamSubmit(e) {
    e.preventDefault();
    clearInterval(timerInterval);
    const formData = new FormData(document.getElementById("examForm"));
    const answers = [];

    formData.forEach((value, key) => {
      answers.push({ question_id: key.replace("q_", ""), selected_option: value });
    });

    try {
      const res = await fetch(`${API_BASE}/exams/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ exam_id: examId, student_id: user.student_id || user.id, answers })
      });
      if (!res.ok) throw new Error("Submission failed");

      alert("Assessment submitted successfully!");
      window.location.href = "student-dashboard.html";
    } catch (err) { alert(err.message); }
  }

  loadQuestions();
</script>
</body>
</html>
